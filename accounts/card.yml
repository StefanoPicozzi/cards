apiVersion: v1
kind: Card
metadata:
  name: accounts
  description: Sign-up and sign-in for your visitors, and the console that manages them
  type: pattern
  added: 2026-10-09
  steward: edgible-org

applications:
  - name: accounts
    what: Logto sign-in pages and OIDC for your apps
    from: svhd/logto:1.44.0
    database: postgres:17-alpine
    port: 3011
    protocol: https
    subtype: existing
    published: true
    authModes: [none]
    place: identity

  - name: accounts-admin
    what: Logto console, same process as accounts
    from: svhd/logto:1.44.0
    port: 3012
    protocol: https
    subtype: existing
    published: true
    authModes: [org]
    place: identity
