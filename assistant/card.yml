apiVersion: v1
kind: Card
metadata:
  name: assistant
  description: Chat that answers from your own documents, and the model that runs it
  type: pattern
  added: 2026-10-09

applications:
  - name: assistant
    what: chat over your documents
    from: ghcr.io/open-webui/open-webui:latest
    port: 8088
    protocol: https
    subtype: existing
    published: true
    authModes: [org]
    place: desk

  - name: ollama
    what: chat and embedding models
    from: ollama/ollama:latest
    port: 11434
    protocol: https
    subtype: existing
    published: true
    authModes: [api-key]
    place: desk
