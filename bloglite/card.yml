apiVersion: v1
kind: Card
metadata:
  name: bloglite
  description: bloglite, a micro-blog with Markdown, syntax highlighting and phone publishing, public with the owner's own login
  type: app

applications:
  - name: bloglite
    what: bloglite, the public blog and the owner's login and editor
    from: zot.huijzer.xyz/bloglite:3.0.0
    port: 3000
    protocol: https
    subtype: existing
    published: true
    authModes: [none]
    place: bloglite

data:
  volumes:
    bloglite-data:
      class: irreplaceable
  fingerprint:
    service: bloglite-tools
    command: >-
      page=$(wget -qO- http://bloglite:3000/) &&
      echo "{\"posts\": $(echo "$page" | grep -o 'href="/posts/[0-9]*' | sort -u | wc -l)}"

places:
  bloglite:
    memory: 128 MB
    disk: 1 GB
    arch: [amd64, arm64]
    gpu: none
