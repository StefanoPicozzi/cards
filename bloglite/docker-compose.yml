# Compose file for the bloglite card.
# The host port and ORG_LABEL come from card.env. The owner's password is made on this machine
# by bloglite-secrets, at first start, and never leaves it. Start with:
#   docker compose --env-file card.env -f docker-compose.yml up -d --wait
# The image's own health command is used as the healthcheck.

name: bloglite

services:
  # Makes the owner's password (card.yml secrets:) if it does not exist yet, as a file in the
  # volume bloglite-secrets, then exits. It never changes it after.
  bloglite-secrets:
    image: ghcr.io/edgible-org/card-secrets:0.1.2
    restart: "no"
    environment:
      CARD_SECRETS: |
        BLOGLITE_ADMIN_PASSWORD=openssl rand -base64 24
    volumes:
      - bloglite-secrets:/run/card-secrets

  bloglite:
    image: zot.huijzer.xyz/bloglite:3.1.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:${BLOGLITE_PORT:?set BLOGLITE_PORT in card.env}:3000"
    environment:
      BLOGLITE_USERNAME: ${BLOGLITE_ADMIN_USER:?set BLOGLITE_ADMIN_USER in card.env}
      # The image has no shell, so it reads the password from the file itself (since 3.1.0).
      BLOGLITE_PASSWORD_FILE: /run/card-secrets/BLOGLITE_ADMIN_PASSWORD
      BLOGLITE_DOMAIN: ${BLOGLITE_DOMAIN:-bloglite.${ORG_LABEL:?set ORG_LABEL in card.env}.${EDGIBLE_DOMAIN:-edgible.app}}
    volumes:
      - bloglite-data:/data
      - bloglite-secrets:/run/card-secrets:ro
    depends_on:
      bloglite-secrets:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/bloglite", "check-health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  # The bloglite image has no shell, so the data fingerprint runs here and reads the
  # blog over the Compose network.
  bloglite-tools:
    image: alpine:3.20.3
    restart: unless-stopped
    command: ["sleep", "infinity"]
    depends_on:
      bloglite:
        condition: service_healthy

volumes:
  bloglite-data: {}
  bloglite-secrets: {}
