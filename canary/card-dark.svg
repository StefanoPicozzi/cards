<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 474" width="720" height="474" role="img" aria-labelledby="t d">
<title id="t">The canary card lists three apps in one place, and no hostnames. Place canary is one serving device: canary is whoami, open to anyone on port 8095, open to anyone. canary-org is whoami behind an org login, same process as canary on port 8095, org login. canary-key is whoami behind an API key, same process as canary on port 8095, bearer key. The card names no device and no organization.</title>
<desc id="d">The canary card lists three apps in one place, and no hostnames. Place canary is one serving device: canary is whoami, open to anyone on port 8095, open to anyone. canary-org is whoami behind an org login, same process as canary on port 8095, org login. canary-key is whoami behind an API key, same process as canary on port 8095, bearer key. The card names no device and no organization.</desc>
<style>.label{font-family:Jost,system-ui,sans-serif;font-size:15px;fill:#e7e7f0}.small{font-family:Jost,system-ui,sans-serif;font-size:13px;fill:#a5a8bd}.mono{font-family:Iosevka,ui-monospace,monospace;font-size:15px;fill:#e7e7f0}.head{font-family:Jost,system-ui,sans-serif;font-size:13px;font-weight:600;fill:#ffffff;letter-spacing:.04em}.place{font-family:Jost,system-ui,sans-serif;font-size:13px;fill:#e7e7f0}.card{fill:#22223c;stroke:#3a3a5c;stroke-width:1.5}</style>
<rect x="0" y="0" width="720" height="474" rx="10" fill="#1a1a2e"/>
<path d="M10 0 h700 a10 10 0 0 1 10 10 v34 h-720 v-34 a10 10 0 0 1 10 -10 z" fill="#3a56ad"/>
<text class="head" x="28" y="28">CANARY CARD</text>
<text class="small" x="56" y="94">app</text>
<text class="small" x="250" y="94">port</text>
<text class="small" x="684" y="94" text-anchor="end">auth</text>
<rect x="28" y="108" width="664" height="32" rx="6" fill="#33334f"/>
<text class="place" x="42" y="129">place</text>
<text class="mono" x="90" y="130">canary</text>
<text class="place" x="678" y="129" text-anchor="end">one serving device</text>
<rect class="card" x="28" y="150" width="664" height="72" rx="8"/>
<rect x="28" y="150" width="6" height="72" rx="3" fill="#7db2e8"/>
<text class="mono" x="56" y="180">canary</text>
<text class="mono" x="250" y="180">8095</text>
<text class="small" x="684" y="180" text-anchor="end">open to anyone</text>
<text class="small" x="56" y="200">whoami, open to anyone</text>
<rect class="card" x="28" y="234" width="664" height="72" rx="8"/>
<rect x="28" y="234" width="6" height="72" rx="3" fill="#c3c6d8"/>
<text class="mono" x="56" y="264">canary-org</text>
<text class="mono" x="250" y="264">8095</text>
<text class="small" x="684" y="264" text-anchor="end">org login</text>
<text class="small" x="56" y="284">whoami behind an org login, same process as canary</text>
<rect class="card" x="28" y="318" width="664" height="72" rx="8"/>
<rect x="28" y="318" width="6" height="72" rx="3" fill="#b39ce8"/>
<text class="mono" x="56" y="348">canary-key</text>
<text class="mono" x="250" y="348">8095</text>
<text class="small" x="684" y="348" text-anchor="end">bearer key</text>
<text class="small" x="56" y="368">whoami behind an API key, same process as canary</text>
<line x1="28" y1="406" x2="692" y2="406" stroke="#33334f" stroke-width="1.5"/>
<text class="small" x="28" y="428">no device name, no hostname, no organization id</text>
</svg>
