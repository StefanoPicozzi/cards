apiVersion: v1
kind: Card
metadata:
  name: ci
  description: Your own Git forge with CI, and the runner on a machine of its own
  type: pattern
  added: 2026-10-10

applications:
  - name: gitea
    what: Gitea web, API, and Git over HTTPS
    from: gitea/gitea:28.1.0
    database: postgres:17.11-alpine
    port: 3003
    protocol: https
    subtype: existing
    published: true
    authModes: [none]
    place: forge

  - name: gitea-ssh
    what: Git over SSH, same process as gitea
    from: gitea/gitea:28.1.0
    port: 22222
    protocol: tcp
    subtype: existing
    published: true
    authModes: [none]
    place: forge

places:
  forge:
    memory: 384 MB
    disk: 1.5 GB
    arch: [amd64, arm64]
    gpu: none
  runner:
    runs: [runner-compose.yml]
    memory: 2 GB
    disk: 10 GB
    arch: [amd64, arm64]
    gpu: none
