apiVersion: v1
kind: Card
metadata:
  name: docmost
  description: Docmost, a collaborative team wiki and Notion or Confluence alternative, behind your org login
  type: app
  added: 2026-10-27
  homepage: https://docmost.com
  license: AGPL-3.0-only

applications:
  - name: docmost
    what: Docmost wiki, for the people who read and edit it in a browser
    from: docmost/docmost:0.97.0
    database: postgres:17.11-alpine
    port: 3000
    protocol: https
    subtype: existing
    published: true
    authModes: [org]
    place: docmost

secrets:
  DOCMOST_DB_PASSWORD:
    kind: internal
    use: password
    make: openssl rand -hex 16
    update:
      service: docmost-db
      command: psql -U docmost -d docmost -c "ALTER USER docmost PASSWORD '$DOCMOST_DB_PASSWORD'"
  DOCMOST_APP_SECRET:
    kind: internal
    use: signing
    make: openssl rand -hex 32
  DOCMOST_ADMIN_PASSWORD:
    kind: human
    make: openssl rand -hex 16
    for: the admin's first sign-in, set by prepare.sh when it makes the workspace

data:
  volumes:
    docmost-db-data:
      class: irreplaceable
      dump:
        service: docmost-db
        command: pg_dump -U "$POSTGRES_USER" -Fc "$POSTGRES_DB"
        restore: pg_restore -U "$POSTGRES_USER" -d "$POSTGRES_DB" --clean
    docmost-data:
      class: irreplaceable
    docmost-redis-data:
      class: cache
    docmost-secrets:
      class: irreplaceable
  fingerprint:
    service: docmost-db
    command: psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tAc "select json_build_object('users', (select count(*) from users), 'pages', (select count(*) from pages))"

places:
  docmost:
    memory: 1 GB
    disk: 3 GB
    arch: [amd64, arm64]
    gpu: none
