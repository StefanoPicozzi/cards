# Compose file for the edgible-agent pattern: the openclaw and edgible-mcp app cards in one
# Compose project, so OpenClaw reaches Edgible's MCP tools on this project's network, and nothing
# else does. OpenClaw's Gateway is on this machine's loopback only. Ports and the model come from card.env; the Gateway token is made
# on this machine by openclaw-secrets. Start with:
#   docker compose --env-file card.env -f docker-compose.yml up -d --wait
# openclaw-setup runs OpenClaw's onboarding once, then the Gateway starts. openclaw-cli runs
# OpenClaw's own commands, such as approving a device:
#   docker compose --env-file card.env -f docker-compose.yml run --rm --no-deps openclaw-cli devices list

name: edgible-agent

x-openclaw-env: &openclaw-env
  HOME: /home/node
  OPENCLAW_HOME: /home/node
  OPENCLAW_STATE_DIR: /home/node/.openclaw
  OPENCLAW_CONFIG_PATH: /home/node/.openclaw/openclaw.json
  OPENCLAW_CONFIG_DIR: /home/node/.openclaw
  OPENCLAW_WORKSPACE_DIR: /home/node/.openclaw/workspace
  OPENCLAW_GATEWAY_PORT: "18789"
  # The Gateway token, and the model's key: OpenClaw reads them from here, never from its files.
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
  CUSTOM_API_KEY: ${OPENCLAW_MODEL_KEY:-}
  OPENCLAW_DISABLE_BONJOUR: "1"
  OPENCLAW_USERS: ${OPENCLAW_USERS:-}
  TERM: xterm-256color
  TZ: ${OPENCLAW_TZ:-UTC}

x-openclaw-hardening: &openclaw-hardening
  cap_drop: [NET_RAW, NET_ADMIN]
  security_opt: [no-new-privileges:true]
  init: true

services:
  # Makes the Gateway token (card.yml secrets:) if it does not exist yet, as a file in the volume
  # openclaw-card-secrets, then exits. It never changes it after. Every OpenClaw service starts
  # through the loader, which puts the token in its environment.
  openclaw-secrets:
    image: ghcr.io/edgible-org/card-secrets:0.1.2
    restart: "no"
    environment:
      CARD_SECRETS: |
        OPENCLAW_GATEWAY_TOKEN=openssl rand -hex 32
    volumes:
      - openclaw-card-secrets:/run/card-secrets

  openclaw-setup:
    image: ghcr.io/openclaw/openclaw:2026.10.5
    <<: *openclaw-hardening
    restart: "no"
    environment:
      <<: *openclaw-env
      OPENCLAW_URL: ${OPENCLAW_URL:-https://openclaw.${ORG_LABEL:?set ORG_LABEL in card.env}.${EDGIBLE_DOMAIN:-edgible.app}}
      OPENCLAW_MODEL_PROVIDER: ${OPENCLAW_MODEL_PROVIDER:-gemini}
      OPENCLAW_MODEL: ${OPENCLAW_MODEL:-google/gemini-3.5-flash}
      OPENCLAW_MODEL_URL: ${OPENCLAW_MODEL_URL:-}
      OPENCLAW_FALLBACK_MODEL: ${OPENCLAW_FALLBACK_MODEL:-}
      OPENCLAW_FALLBACK_URL: ${OPENCLAW_FALLBACK_URL:-}
      EDGIBLE_MCP_URL: http://edgible-mcp:8000/mcp
      EDGIBLE_SKILL: "1"
    entrypoint: ["sh", "/run/card-secrets/.load", "sh", "/setup.sh"]
    depends_on:
      openclaw-secrets:
        condition: service_completed_successfully
    configs:
      - source: openclaw-setup
        target: /setup.sh
    volumes:
      - openclaw-data:/home/node/.openclaw
      - openclaw-secrets:/home/node/.config/openclaw
      - openclaw-card-secrets:/run/card-secrets:ro

  edgible-mcp:
    image: ghcr.io/edgible-org/edgible-mcp:0.7.1
    restart: unless-stopped
    environment:
      EDGIBLE_MCP_ALLOW_WRITE: ${EDGIBLE_MCP_ALLOW_WRITE:-0}
      EDGIBLE_MCP_DEVICES: ${EDGIBLE_MCP_DEVICES:-}
      EDGIBLE_MCP_CACHE_DIR: /root/.cache/edgible-mcp
      EDGIBLE_MCP_SIGN_IN: docker compose --env-file edgible-agent/card.env -f edgible-agent/docker-compose.yml exec edgible-mcp edgible auth login --no-browser
    volumes:
      - edgible-mcp-cache:/root/.cache
      # The Edgible CLI's sign-in, which the agent's Edgible tools act as.
      - edgible-mcp-login:/login
      # With writes: the record of what the tools did, and each deployed card's Compose file.
      - edgible-mcp-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8000/healthz | grep -q ok"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 1m

  openclaw:
    image: ghcr.io/openclaw/openclaw:2026.10.5
    <<: *openclaw-hardening
    restart: unless-stopped
    depends_on:
      openclaw-setup:
        condition: service_completed_successfully
      edgible-mcp:
        condition: service_healthy
    environment: *openclaw-env
    # With OPENCLAW_USERS, Edgible's sign-in is the Gateway's auth (trusted-proxy): the token
    # then serves only OpenClaw's own command line, as its password, and must not be the token.
    entrypoint: ["tini", "-s", "--", "sh", "/run/card-secrets/.load", "sh", "-c", 'if [ -n "$${OPENCLAW_USERS:-}" ]; then export OPENCLAW_GATEWAY_PASSWORD="$$OPENCLAW_GATEWAY_TOKEN"; unset OPENCLAW_GATEWAY_TOKEN; fi; exec "$$@"', "sh", "node", "/app/docker-entrypoint.mjs"]
    command: ["node", "dist/index.js", "gateway", "--bind", "lan", "--port", "18789"]
    ports:
      # Loopback only: the Control UI is an admin console over an agent with a shell.
      - "127.0.0.1:${OPENCLAW_PORT:?set OPENCLAW_PORT in card.env}:18789"
    extra_hosts:
      # A model on this machine, such as ollama-mac: http://host.docker.internal:11434/v1
      - "host.docker.internal:host-gateway"
    volumes:
      # The agent's config, memory, sessions and workspace.
      - openclaw-data:/home/node/.openclaw
      - openclaw-secrets:/home/node/.config/openclaw
      - openclaw-card-secrets:/run/card-secrets:ro
    healthcheck:
      test: ["CMD", "node", "dist/docker-healthcheck.js"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  openclaw-cli:
    image: ghcr.io/openclaw/openclaw:2026.10.5
    <<: *openclaw-hardening
    profiles: [cli]
    # Shares the Gateway's network and processes: OpenClaw only lets the Gateway's own
    # process namespace change its config while it runs.
    network_mode: "service:openclaw"
    pid: "service:openclaw"
    environment:
      <<: *openclaw-env
      BROWSER: echo
    entrypoint: ["sh", "/run/card-secrets/.load", "sh", "-c", 'if [ -n "$${OPENCLAW_USERS:-}" ]; then export OPENCLAW_GATEWAY_PASSWORD="$$OPENCLAW_GATEWAY_TOKEN"; unset OPENCLAW_GATEWAY_TOKEN; fi; exec "$$@"', "sh", "node", "dist/index.js"]
    volumes:
      - openclaw-data:/home/node/.openclaw
      - openclaw-secrets:/home/node/.config/openclaw
      - openclaw-card-secrets:/run/card-secrets:ro

configs:
  openclaw-setup:
    file: ./setup.sh

volumes:
  openclaw-data: {}
  openclaw-secrets: {}
  edgible-mcp-cache: {}
  edgible-mcp-login: {}
  edgible-mcp-data: {}
  openclaw-card-secrets: {}
