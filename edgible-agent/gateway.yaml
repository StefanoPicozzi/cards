# The litellm card's gateway: models by purpose, not by provider. Apps ask for fast, smart,
# best, private or private-smart, and never need to know which provider answered. Each model comes from a card.env
# setting (LITELLM_*_MODEL); LiteLLM finds a provider's key in that provider's usual variable,
# such as GEMINI_API_KEY or DEEPSEEK_API_KEY, which the card passes on and never stores.

model_list:
  # fast: everyday answers. DeepSeek by default (reliable, cents a day), then fast-fallback (Gemini Flash).
  - model_name: fast
    litellm_params:
      model: os.environ/LITELLM_FAST_MODEL
  - model_name: fast-fallback
    litellm_params:
      model: os.environ/LITELLM_FAST_FALLBACK_MODEL
  # smart: harder questions, slower and dearer. Falls back to fast.
  - model_name: smart
    litellm_params:
      model: os.environ/LITELLM_SMART_MODEL
  # open: a strong open model through OpenRouter (GLM by default), where one key reaches hundreds
  # of models: change LITELLM_OPEN_MODEL to try another. Falls back to fast.
  - model_name: open
    litellm_params:
      model: os.environ/LITELLM_OPEN_MODEL
  # best: for when it really matters (Claude Opus by default), dearest by far. Ask for it on
  # purpose; it falls back to smart, never the other way.
  - model_name: best
    litellm_params:
      model: os.environ/LITELLM_BEST_MODEL
      # Its own spending cap, whichever app asks: past it, best falls back to smart. Kept in memory,
      # so a restart starts the count again; the provider's prepaid credits stay the hard cap.
      max_budget: os.environ/LITELLM_BEST_BUDGET
      budget_duration: os.environ/LITELLM_BEST_BUDGET_PERIOD
  # private: a model on your own machine (Ollama, such as the ollama-mac card): nothing leaves it.
  # Its price is set above zero so a budget still counts it.
  - model_name: private
    litellm_params:
      model: os.environ/LITELLM_PRIVATE_MODEL
      api_base: os.environ/LITELLM_PRIVATE_URL
      input_cost_per_token: 0.0000001
      output_cost_per_token: 0.0000001
  # private-smart: a larger model on your own machine, for real work that must stay private, on a
  # machine with the memory for it. Falls back to private, never to a model elsewhere.
  - model_name: private-smart
    litellm_params:
      model: os.environ/LITELLM_PRIVATE_SMART_MODEL
      api_base: os.environ/LITELLM_PRIVATE_URL
      input_cost_per_token: 0.0000001
      output_cost_per_token: 0.0000001

router_settings:
  # When a model fails (a free tier's 429, a provider down), the next one answers. Fallbacks go
  # sideways or down, never up to a dearer model, and a private one never falls back to a model
  # elsewhere.
  fallbacks:
    - fast: [fast-fallback]
    - smart: [fast]
    - open: [fast]
    - best: [smart]
    - private-smart: [private]

litellm_settings:
  drop_params: true
