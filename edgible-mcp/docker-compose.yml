# Compose file for the edgible-mcp card. The host port and the settings come from card.env.
# The image is ghcr.io/edgible-org/edgible-mcp, built from card-kit's edgible-mcp/, which serves
# MCP over Streamable HTTP at /mcp. Start with:
#   docker compose --env-file card.env -f docker-compose.yml up -d --wait

name: edgible-mcp

services:
  edgible-mcp:
    image: ghcr.io/edgible-org/edgible-mcp:0.7.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:${EDGIBLE_MCP_PORT:?set EDGIBLE_MCP_PORT in card.env}:8000"
    environment:
      EDGIBLE_MCP_ALLOW_WRITE: ${EDGIBLE_MCP_ALLOW_WRITE:-0}
      EDGIBLE_MCP_DEVICES: ${EDGIBLE_MCP_DEVICES:-}
      EDGIBLE_MCP_CACHE_DIR: /root/.cache/edgible-mcp
      EDGIBLE_MCP_CATALOG_TTL: ${EDGIBLE_MCP_CATALOG_TTL:-900}
      EDGIBLE_MCP_SIGN_IN: docker compose --env-file edgible-mcp/card.env -f edgible-mcp/docker-compose.yml exec edgible-mcp edgible auth login --no-browser
    volumes:
      # The catalog of cards, cached.
      - edgible-mcp-cache:/root/.cache
      # The Edgible CLI's sign-in: its HOME in the container, never this directory.
      - edgible-mcp-login:/login
      # With writes: the record of what the tools did, and each deployed card's Compose file.
      - edgible-mcp-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8000/healthz | grep -q ok"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 1m

volumes:
  edgible-mcp-cache: {}
  edgible-mcp-login: {}
  edgible-mcp-data: {}
