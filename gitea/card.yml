apiVersion: v1
kind: Card
metadata:
  name: gitea
  description: Gitea, your own Git forge, with Git over HTTPS and SSH
  type: app
  added: 2026-10-09
  homepage: https://about.gitea.com
  steward: edgible-org

applications:
  - name: gitea
    what: Gitea web, API, and Git over HTTPS
    from: gitea/gitea:28.1.0
    database: postgres:17.11-alpine
    port: 3003
    protocol: https
    subtype: existing
    published: true
    authModes: [none]
    place: gitea

  - name: gitea-ssh
    what: Git over SSH, same process as gitea
    from: gitea/gitea:28.1.0
    port: 22222
    protocol: tcp
    subtype: existing
    published: true
    authModes: [none]
    place: gitea

secrets:
  GITEA_DB_PASSWORD:
    kind: internal
    use: password
    make: openssl rand -hex 16
    update:
      service: gitea-db
      command: psql -U gitea -d gitea -c "ALTER USER gitea PASSWORD '$GITEA_DB_PASSWORD'"
  GITEA_SECRET_KEY:
    kind: internal
    use: signing
    make: openssl rand -hex 32
  GITEA_ADMIN_PASSWORD:
    kind: human
    make: openssl rand -hex 16
    for: gitadmin's sign-in, set by prepare.sh

places:
  gitea:
    memory: 256 MB
    disk: 1.5 GB
    arch: [amd64, arm64]
    gpu: none
