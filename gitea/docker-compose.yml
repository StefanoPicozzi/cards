# Compose file for the gitea card.
# Ports and ORG_LABEL come from card.env. The passwords and keys are made on this machine by
# gitea-secrets, at first start, and never leave it. Start with:
#   docker compose --env-file card.env -f docker-compose.yml up -d --wait

name: gitea

services:
  # Makes each secret in card.yml's secrets: that does not exist yet, one file each in the
  # volume gitea-secrets, then exits. It never changes one that exists.
  gitea-secrets:
    image: ghcr.io/edgible-org/card-secrets:0.1.2
    restart: "no"
    environment:
      CARD_SECRETS: |
        GITEA_DB_PASSWORD=openssl rand -hex 16
        GITEA_SECRET_KEY=openssl rand -hex 32
        GITEA_ADMIN_PASSWORD=openssl rand -hex 16
    volumes:
      - gitea-secrets:/run/card-secrets

  gitea:
    image: gitea/gitea:28.1.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:${GITEA_PORT:?set GITEA_PORT in card.env}:3000"
      - "127.0.0.1:${GITEA_SSH_PORT:?set GITEA_SSH_PORT in card.env}:22"
    environment:
      USER_UID: "1000"
      USER_GID: "1000"
      GITEA__database__DB_TYPE: postgres
      GITEA__database__HOST: gitea-db:5432
      GITEA__database__NAME: gitea
      GITEA__database__USER: gitea
      GITEA__database__PASSWD__FILE: /run/card-secrets/GITEA_DB_PASSWORD
      GITEA__server__ROOT_URL: ${GITEA_URL:-https://gitea.${ORG_LABEL:?set ORG_LABEL in card.env}.${EDGIBLE_DOMAIN:-edgible.app}}/
      GITEA__server__SSH_DOMAIN: gitea-ssh.${ORG_LABEL:?set ORG_LABEL in card.env}.${EDGIBLE_DOMAIN:-edgible.app}
      GITEA__server__SSH_PORT: ${GITEA_SSH_PORT:?set GITEA_SSH_PORT in card.env}
      GITEA__security__SECRET_KEY__FILE: /run/card-secrets/GITEA_SECRET_KEY
      # The web installer is never served; the admin is made from the command line.
      GITEA__security__INSTALL_LOCK: "true"
      # The hostname is open to anyone, so nobody may register; the admin adds people.
      GITEA__service__DISABLE_REGISTRATION: "true"
    volumes:
      - gitea-data:/data
      - gitea-secrets:/run/card-secrets:ro
    depends_on:
      gitea-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/healthz | grep -q pass"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  gitea-db:
    image: postgres:17.11-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: gitea
      POSTGRES_USER: gitea
      POSTGRES_PASSWORD_FILE: /run/card-secrets/GITEA_DB_PASSWORD
    volumes:
      - gitea-db-data:/var/lib/postgresql/data
      - gitea-secrets:/run/card-secrets:ro
    depends_on:
      gitea-secrets:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gitea -d gitea"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  gitea-data: {}
  gitea-db-data: {}
  gitea-secrets: {}
