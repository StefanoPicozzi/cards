apiVersion: v1
kind: Card
metadata:
  name: jellyfin
  description: Jellyfin, your films, shows and music, streamed to its apps and the web
  type: app
  added: 2026-10-09
  homepage: https://jellyfin.org

applications:
  - name: jellyfin
    what: Jellyfin web, API, and its TV and phone apps
    from: jellyfin/jellyfin:12.2.20261005-225228
    port: 8096
    protocol: https
    subtype: existing
    published: true
    authModes: [none]
    place: jellyfin

secrets:
  JELLYFIN_ADMIN_PASSWORD:
    kind: human
    make: openssl rand -hex 16
    for: the admin's sign-in, set by prepare.sh

places:
  jellyfin:
    memory: 4 GB
    disk: 10 GB
    arch: [amd64, arm64]
    gpu: optional
