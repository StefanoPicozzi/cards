apiVersion: v1
kind: Card
metadata:
  name: leafwiki
  description: LeafWiki, a fast Markdown wiki with a page tree, for a team, behind your org login
  type: app
  added: 2026-10-28
  homepage: https://github.com/perber/leafwiki
  license: MIT
  steward: edgible-org

applications:
  - name: leafwiki
    what: LeafWiki, for the people who read and edit the wiki in a browser
    from: ghcr.io/perber/leafwiki:v0.14.2
    port: 8080
    protocol: https
    subtype: existing
    published: true
    authModes: [org]
    place: leafwiki

secrets:
  LEAFWIKI_JWT_SECRET:
    kind: internal
    use: signing
    make: openssl rand -hex 32
  LEAFWIKI_ADMIN_PASSWORD:
    kind: human
    make: openssl rand -hex 16
    for: the admin's first sign-in, set by LeafWiki when it first starts

data:
  volumes:
    leafwiki-data:
      class: irreplaceable
    leafwiki-secrets:
      class: irreplaceable        # the card's secrets, made on the device: back up with the data
  fingerprint:
    service: leafwiki
    command: >-
      echo "{\"files\": $(find /app/data -type f -name '*.md' | wc -l | tr -d ' ')}"

places:
  leafwiki:
    memory: 256 MB
    disk: 1 GB
    arch: [amd64, arm64]
    gpu: none
