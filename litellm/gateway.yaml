# The litellm card's gateway: models by purpose, not by provider. Apps ask for fast, smart or
# private, and never need to know which provider answered. Each model comes from a card.env
# setting (LITELLM_*_MODEL); LiteLLM finds a provider's key in that provider's usual variable,
# such as GEMINI_API_KEY or DEEPSEEK_API_KEY, which the card passes on and never stores.

model_list:
  # fast: everyday answers. Gemini Flash by default (a free tier exists), then fast-fallback.
  - model_name: fast
    litellm_params:
      model: os.environ/LITELLM_FAST_MODEL
  - model_name: fast-fallback
    litellm_params:
      model: os.environ/LITELLM_FAST_FALLBACK_MODEL
  # smart: harder questions, slower and dearer. Falls back to fast.
  - model_name: smart
    litellm_params:
      model: os.environ/LITELLM_SMART_MODEL
  # private: a model on your own machine (Ollama, such as the ollama-mac card): nothing leaves it.
  # Its price is set above zero so a budget still counts it.
  - model_name: private
    litellm_params:
      model: os.environ/LITELLM_PRIVATE_MODEL
      api_base: os.environ/LITELLM_PRIVATE_URL
      input_cost_per_token: 0.0000001
      output_cost_per_token: 0.0000001

router_settings:
  # When a model fails (a free tier's 429, a provider down), the next one answers.
  fallbacks:
    - fast: [fast-fallback]
    - smart: [fast]

litellm_settings:
  drop_params: true
