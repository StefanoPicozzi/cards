apiVersion: v1
kind: Card
metadata:
  name: mcp-signin
  description: Sign in with Edgible in front of any MCP server, so Claude on the web and phone can use it
  type: app
  added: 2026-10-20

applications:
  - name: mcp-signin
    what: MCP and OAuth for the connector, passed on to the MCP server behind
    from: ghcr.io/edgible-org/mcp-signin:0.2.0
    port: 8020
    protocol: https
    subtype: existing
    published: true
    authModes: [none]
    place: mcp-signin

  - name: mcp-signin-login
    what: The sign-in page, same process as mcp-signin
    from: ghcr.io/edgible-org/mcp-signin:0.2.0
    port: 8023
    protocol: https
    subtype: existing
    published: true
    authModes: [org]
    place: mcp-signin

data:
  volumes:
    # Registered assistants and tokens: losing them signs everyone out, and nothing else.
    mcp-signin-data:
      class: cache

places:
  mcp-signin:
    memory: 256 MB
    disk: 1.5 GB
    arch: [amd64, arm64]
    gpu: none
