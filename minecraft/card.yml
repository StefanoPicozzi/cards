apiVersion: v1
kind: Card
metadata:
  name: minecraft
  description: A Minecraft server for friends on PC over TCP and on phones over UDP, one world
  type: app
  added: 2026-10-09
  homepage: https://papermc.io

applications:
  - name: mc-java
    what: Paper server, Java Edition players
    from: itzg/minecraft-server:2026.9.2
    port: 25565
    protocol: tcp
    subtype: existing
    published: true
    authModes: [none]
    place: minecraft

  - name: mc-bedrock
    what: Geyser, Bedrock players, same process
    from: itzg/minecraft-server:2026.9.2
    port: 29132
    protocol: udp
    subtype: existing
    published: true
    authModes: [none]
    place: minecraft

places:
  minecraft:
    memory: 4 GB
    disk: 2 GB
    arch: [amd64, arm64]
    gpu: none
