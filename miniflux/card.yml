apiVersion: v1
kind: Card
metadata:
  name: miniflux
  description: Miniflux, the minimalist feed reader, behind your org login
  type: app
  added: 2026-10-10
  homepage: https://miniflux.app
  steward: edgible-org

applications:
  - name: miniflux
    what: Miniflux feed reader
    from: miniflux/miniflux:2.3.3
    database: postgres:17.11-alpine
    port: 8080
    protocol: https
    subtype: existing
    published: true
    authModes: [org]
    place: miniflux

secrets:
  MINIFLUX_DB_PASSWORD:
    kind: internal
    use: password
    make: openssl rand -hex 16
    update:
      service: miniflux-db
      command: psql -U miniflux -d miniflux -c "ALTER USER miniflux PASSWORD '$MINIFLUX_DB_PASSWORD'"
  MINIFLUX_DATABASE_URL:
    kind: internal
    use: password
    on-move: new
    make: printf 'postgres://miniflux:'; cat /run/card-secrets/MINIFLUX_DB_PASSWORD; printf '@miniflux-db/miniflux?sslmode=disable'
  MINIFLUX_ADMIN_PASSWORD:
    kind: human
    make: openssl rand -hex 16
    for: admin's sign-in, made by Miniflux on first start

places:
  miniflux:
    memory: 384 MB
    disk: 1.5 GB
    arch: [amd64, arm64]
    gpu: none
