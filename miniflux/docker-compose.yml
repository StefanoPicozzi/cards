# Compose file for the miniflux card.
# The host port, ORG_LABEL and the passwords come from card.env. Start with:
#   docker compose --env-file card.env -f docker-compose.yml up -d --wait

name: miniflux

services:
  miniflux:
    image: miniflux/miniflux:2.3.3
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MINIFLUX_PORT:?set MINIFLUX_PORT in card.env}:8080"
    environment:
      DATABASE_URL: postgres://miniflux:${MINIFLUX_DB_PASSWORD:?set MINIFLUX_DB_PASSWORD in card.env}@miniflux-db/miniflux?sslmode=disable
      RUN_MIGRATIONS: "1"
      CREATE_ADMIN: "1"
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: ${MINIFLUX_ADMIN_PASSWORD:?set MINIFLUX_ADMIN_PASSWORD in card.env}
      BASE_URL: ${MINIFLUX_URL:-https://miniflux.${ORG_LABEL:?set ORG_LABEL in card.env}.${EDGIBLE_DOMAIN:-edgible.app}}
    depends_on:
      miniflux-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/bin/miniflux", "-healthcheck", "auto"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  miniflux-db:
    image: postgres:17.11-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: miniflux
      POSTGRES_USER: miniflux
      POSTGRES_PASSWORD: ${MINIFLUX_DB_PASSWORD:?set MINIFLUX_DB_PASSWORD in card.env}
    volumes:
      - miniflux-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U miniflux -d miniflux"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  miniflux-db-data: {}
