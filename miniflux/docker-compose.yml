# Compose file for the miniflux card.
# The host port and ORG_LABEL come from card.env. The passwords are made on this machine by
# miniflux-secrets, at first start, and never leave it. Start with:
#   docker compose --env-file card.env -f docker-compose.yml up -d --wait

name: miniflux

services:
  # Makes each secret in card.yml's secrets: that does not exist yet, one file each in the
  # volume miniflux-secrets, then exits. It never changes one that exists.
  miniflux-secrets:
    image: ghcr.io/edgible-org/card-secrets:0.1.2
    restart: "no"
    environment:
      CARD_SECRETS: |
        MINIFLUX_DB_PASSWORD=openssl rand -hex 16
        MINIFLUX_ADMIN_PASSWORD=openssl rand -hex 16
        MINIFLUX_DATABASE_URL=printf 'postgres://miniflux:'; cat /run/card-secrets/MINIFLUX_DB_PASSWORD; printf '@miniflux-db/miniflux?sslmode=disable'
    volumes:
      - miniflux-secrets:/run/card-secrets

  miniflux:
    image: miniflux/miniflux:2.3.3
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MINIFLUX_PORT:?set MINIFLUX_PORT in card.env}:8080"
    # Miniflux reads these two from files, so no entrypoint script is needed and the values are
    # never in the container's environment.
    volumes:
      - miniflux-secrets:/run/card-secrets:ro
    environment:
      DATABASE_URL_FILE: /run/card-secrets/MINIFLUX_DATABASE_URL
      ADMIN_PASSWORD_FILE: /run/card-secrets/MINIFLUX_ADMIN_PASSWORD
      RUN_MIGRATIONS: "1"
      CREATE_ADMIN: "1"
      ADMIN_USERNAME: admin
      BASE_URL: ${MINIFLUX_URL:-https://miniflux.${ORG_LABEL:?set ORG_LABEL in card.env}.${EDGIBLE_DOMAIN:-edgible.app}}
    depends_on:
      miniflux-secrets:
        condition: service_completed_successfully
      miniflux-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/bin/miniflux", "-healthcheck", "auto"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  miniflux-db:
    image: postgres:17.11-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: miniflux
      POSTGRES_USER: miniflux
      POSTGRES_PASSWORD_FILE: /run/card-secrets/MINIFLUX_DB_PASSWORD
    volumes:
      - miniflux-db-data:/var/lib/postgresql/data
      - miniflux-secrets:/run/card-secrets:ro
    depends_on:
      miniflux-secrets:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U miniflux -d miniflux"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  miniflux-db-data: {}
  miniflux-secrets: {}
