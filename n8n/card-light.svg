<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 390" width="720" height="390" role="img" aria-labelledby="t d">
<title id="t">The n8n card lists two apps in one place, and no hostnames. Place workhorse is one serving device: n8n is n8n editor on port 5678, org login. n8n-hooks is n8n webhooks, same process as n8n on port 5678, open to anyone. The card names no device and no organization.</title>
<desc id="d">The n8n card lists two apps in one place, and no hostnames. Place workhorse is one serving device: n8n is n8n editor on port 5678, org login. n8n-hooks is n8n webhooks, same process as n8n on port 5678, open to anyone. The card names no device and no organization.</desc>
<style>.label{font-family:Jost,system-ui,sans-serif;font-size:15px;fill:#000033}.small{font-family:Jost,system-ui,sans-serif;font-size:13px;fill:#4a4f66}.mono{font-family:Iosevka,ui-monospace,monospace;font-size:15px;fill:#000033}.head{font-family:Jost,system-ui,sans-serif;font-size:13px;font-weight:600;fill:#ffffff;letter-spacing:.04em}.place{font-family:Jost,system-ui,sans-serif;font-size:13px;fill:#000033}.card{fill:#ffffff;stroke:#c2c8d8;stroke-width:1.5}</style>
<rect x="0" y="0" width="720" height="390" rx="10" fill="#e4e8f2"/>
<path d="M10 0 h700 a10 10 0 0 1 10 10 v34 h-720 v-34 a10 10 0 0 1 10 -10 z" fill="#2e4a9e"/>
<text class="head" x="28" y="28">N8N CARD</text>
<text class="small" x="56" y="94">app</text>
<text class="small" x="250" y="94">port</text>
<text class="small" x="684" y="94" text-anchor="end">auth</text>
<rect x="28" y="108" width="664" height="32" rx="6" fill="#e0e3ea"/>
<text class="place" x="42" y="129">place</text>
<text class="mono" x="90" y="130">workhorse</text>
<text class="place" x="678" y="129" text-anchor="end">one serving device</text>
<rect class="card" x="28" y="150" width="664" height="72" rx="8"/>
<rect x="28" y="150" width="6" height="72" rx="3" fill="#000033"/>
<text class="mono" x="56" y="180">n8n</text>
<text class="mono" x="250" y="180">5678</text>
<text class="small" x="684" y="180" text-anchor="end">org login</text>
<text class="small" x="56" y="200">n8n editor</text>
<rect class="card" x="28" y="234" width="664" height="72" rx="8"/>
<rect x="28" y="234" width="6" height="72" rx="3" fill="#2f6fb0"/>
<text class="mono" x="56" y="264">n8n-hooks</text>
<text class="mono" x="250" y="264">5678</text>
<text class="small" x="684" y="264" text-anchor="end">open to anyone</text>
<text class="small" x="56" y="284">n8n webhooks, same process as n8n</text>
<line x1="28" y1="322" x2="692" y2="322" stroke="#e0e3ea" stroke-width="1.5"/>
<text class="small" x="28" y="344">no device name, no hostname, no organization id</text>
</svg>
