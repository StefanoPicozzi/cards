# n8n Compose file for the n8n card.
# Passwords, the org label, and the host port come from card.env. Start with:
#   docker compose --env-file card.env -f docker-compose.yml up -d

name: n8n

volumes:
  db_storage:
  n8n_storage:

services:
  postgres:
    image: postgres:18
    restart: always
    environment:
      POSTGRES_USER: changeUser
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in card.env}
      POSTGRES_DB: n8n
      POSTGRES_NON_ROOT_USER: changeUser
      POSTGRES_NON_ROOT_PASSWORD: ${POSTGRES_NON_ROOT_PASSWORD:?set POSTGRES_NON_ROOT_PASSWORD in card.env}
      PGDATA: /var/lib/postgresql/data
    volumes:
      - db_storage:/var/lib/postgresql/data
      - ./init-data.sh:/docker-entrypoint-initdb.d/init-data.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U changeUser -d n8n"]
      interval: 5s
      timeout: 5s
      retries: 10

  n8n:
    image: docker.n8n.io/n8nio/n8n:2.41.4
    restart: always
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: changeUser
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_NON_ROOT_PASSWORD:?set POSTGRES_NON_ROOT_PASSWORD in card.env}
      N8N_RUNNERS_MODE: external
      N8N_RUNNERS_AUTH_TOKEN: ${RUNNERS_AUTH_TOKEN:?set RUNNERS_AUTH_TOKEN in card.env}
      N8N_RUNNERS_BROKER_LISTEN_ADDRESS: 0.0.0.0
      N8N_PROXY_HOPS: "1"
      N8N_PROTOCOL: https
      N8N_HOST: ${N8N_HOSTNAME:-n8n.${ORG_LABEL:?set ORG_LABEL in card.env}.${EDGIBLE_DOMAIN:-edgible.app}}
      N8N_EDITOR_BASE_URL: ${N8N_URL:-https://n8n.${ORG_LABEL:?set ORG_LABEL in card.env}.${EDGIBLE_DOMAIN:-edgible.app}}/
      WEBHOOK_URL: ${N8N_WEBHOOK_URL:-https://n8n-hooks.${ORG_LABEL:?set ORG_LABEL in card.env}.${EDGIBLE_DOMAIN:-edgible.app}}/
    ports:
      - "127.0.0.1:${N8N_PORT:?set N8N_PORT in card.env}:5678"
    links:
      - postgres
    volumes:
      - n8n_storage:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy

  n8n-runner:
    image: n8nio/runners:2.41.4
    restart: always
    environment:
      N8N_RUNNERS_AUTH_TOKEN: ${RUNNERS_AUTH_TOKEN:?set RUNNERS_AUTH_TOKEN in card.env}
      N8N_RUNNERS_TASK_BROKER_URI: http://n8n:5679
    depends_on:
      - n8n
