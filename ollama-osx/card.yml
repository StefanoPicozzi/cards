apiVersion: v1
kind: Card
metadata:
  name: ollama-osx
  description: Ollama on an Apple Silicon Mac, natively on its GPU, as an API behind a key
  type: app
  added: 2026-10-25
  homepage: https://ollama.com

applications:
  - name: ollama
    what: Ollama API on the Mac's GPU, through a small Caddy proxy that lets a key use models but not manage them
    from: https://github.com/ollama/ollama/releases/tag/v0.40.4
    port: 21434
    protocol: https
    subtype: existing
    published: true
    authModes: [api-key]
    place: ollama

places:
  ollama:
    native: macos
    memory: 8 GB
    disk: 2 GB
    arch: [arm64]
