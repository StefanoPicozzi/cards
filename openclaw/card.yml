apiVersion: v1
kind: Card
metadata:
  name: openclaw
  description: OpenClaw, the open-source AI agent, with its Control UI behind your organisation's sign-in
  type: app
  added: 2026-10-20
  homepage: https://openclaw.ai
  steward: edgible-org

applications:
  - name: openclaw
    what: OpenClaw Gateway and Control UI
    from: ghcr.io/openclaw/openclaw:2026.10.5
    port: 18789
    protocol: https
    subtype: existing
    published: true
    authModes: [org]
    place: openclaw

data:
  volumes:
    # The agent's config, memory, sessions and workspace: what makes it yours.
    openclaw-data:
      class: irreplaceable
    # OpenClaw's auth profiles, for providers that sign in rather than take a key.
    openclaw-secrets:
      class: irreplaceable
    # The card's secrets, made on the device: the Gateway token.
    openclaw-card-secrets:
      class: irreplaceable
  fingerprint:
    service: openclaw
    command: >-
      d=/home/node/.openclaw &&
      echo "{\"sessions\": $(find $d/agents -name '*.jsonl' 2>/dev/null | wc -l | tr -d ' '),
      \"workspace_files\": $(find $d/workspace -type f 2>/dev/null | wc -l | tr -d ' ')}"

secrets:
  OPENCLAW_GATEWAY_TOKEN:
    kind: human
    make: openssl rand -hex 32
    for: the Control UI without OPENCLAW_USERS, pasted once per browser; with it, OpenClaw's own command line only
  GEMINI_API_KEY:
    kind: external
    from: https://aistudio.google.com/apikey (free tier)
    required: false
  OPENCLAW_MODEL_KEY:
    kind: external
    from: the OpenAI-compatible model's provider, if it needs a key
    required: false
  DEEPSEEK_API_KEY:
    kind: external
    from: https://platform.deepseek.com/api_keys, for the fallback model
    required: false

places:
  openclaw:
    memory: 2.5 GB
    disk: 3 GB
    arch: [amd64, arm64]
    gpu: none
