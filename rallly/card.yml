apiVersion: v1
kind: Card
metadata:
  name: rallly
  description: Rallly date polls, open to anyone with the link and sign-in limited to the emails you list
  type: app
  added: 2026-10-14
  homepage: https://rallly.co

applications:
  - name: rallly
    what: Rallly poll site, for voters and for the organizers who sign in
    from: lukevella/rallly:4.7.0
    database: postgres:17.11-alpine
    port: 3000
    protocol: https
    subtype: existing
    published: true
    authModes: [none]
    place: rallly

secrets:
  RALLLY_DB_PASSWORD:
    kind: internal
    use: password
    make: openssl rand -hex 16
    update:
      service: rallly-db
      command: psql -U rallly -d rallly -c "ALTER USER rallly PASSWORD '$RALLLY_DB_PASSWORD'"
  RALLLY_SECRET:
    kind: internal
    use: signing
    make: openssl rand -hex 32
  RALLLY_SMTP_PASSWORD:
    kind: external
    from: your mail provider, with RALLLY_SMTP_USER
    required: false

places:
  rallly:
    memory: 512 MB
    disk: 2 GB
    arch: [amd64, arm64]
    gpu: none
