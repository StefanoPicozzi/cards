apiVersion: v1
kind: Card
metadata:
  name: stirling-pdf
  description: Stirling-PDF, the PDF toolbox, behind your org login
  type: app
  added: 2026-10-09
  homepage: https://github.com/Stirling-Tools/Stirling-PDF

applications:
  - name: stirling-pdf
    what: Stirling-PDF, merge, split, convert, OCR
    from: stirlingtools/stirling-pdf:3.1.0
    port: 8090
    protocol: https
    subtype: existing
    published: true
    authModes: [org]
    place: stirling-pdf

places:
  stirling-pdf:
    memory: 2 GB
    disk: 2.5 GB
    arch: [amd64, arm64]
    gpu: none
