apiVersion: v1
kind: Card
metadata:
  name: teamdesk
  description: Teamdesk, room bookings, tasks and announcements for a small team, behind the organisation's Edgible sign-in
  type: app

applications:
  - name: teamdesk
    what: Teamdesk, the team's rooms, bookings, tasks and announcements
    from: ghcr.io/stefano-edgible/teamdesk:1.0.0
    port: 3000
    protocol: https
    subtype: existing
    published: true
    authModes: [org]
    place: teamdesk

data:
  volumes:
    teamdesk-data:
      class: irreplaceable
  fingerprint:
    service: teamdesk
    command: >-
      bun -e 'const n = async (p) => (await (await fetch("http://127.0.0.1:3000/api/trpc/" + p)).json()).result.data.length;
      console.log(JSON.stringify({members: await n("members.list"), rooms: await n("rooms.list")}))'

places:
  teamdesk:
    memory: 256 MB
    disk: 1.5 GB
    arch: [amd64, arm64]
    gpu: none
