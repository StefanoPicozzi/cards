apiVersion: v1
kind: Card
metadata:
  name: uptime-kuma
  description: Uptime Kuma, the uptime monitor, behind your org login
  type: app
  added: 2026-10-09
  homepage: https://github.com/louislam/uptime-kuma
  steward: edgible-org

applications:
  - name: uptime-kuma
    what: Uptime Kuma monitors and status pages
    from: louislam/uptime-kuma:2.5.5-slim
    port: 3001
    protocol: https
    subtype: existing
    published: true
    authModes: [org]
    place: uptime-kuma

places:
  uptime-kuma:
    memory: 256 MB
    disk: 1.5 GB
    arch: [amd64, arm, arm64]
    gpu: none
