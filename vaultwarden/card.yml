apiVersion: v1
kind: Card
metadata:
  name: vaultwarden
  description: Vaultwarden, a Bitwarden-compatible password server, for your own apps and browsers
  type: app
  added: 2026-10-09
  homepage: https://github.com/dani-garcia/vaultwarden
  steward: edgible-org

applications:
  - name: vaultwarden
    what: Vaultwarden, for Bitwarden apps and the web vault
    from: vaultwarden/server:1.37.4
    port: 8222
    protocol: https
    subtype: existing
    published: true
    authModes: [none]
    place: vaultwarden

secrets:
  VAULTWARDEN_ADMIN_TOKEN:
    kind: human
    make: openssl rand -base64 48
    for: the /admin page, where you invite people

places:
  vaultwarden:
    memory: 256 MB
    disk: 1.5 GB
    arch: [amd64, arm, arm64]
    gpu: none
