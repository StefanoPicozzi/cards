<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 690" width="720" height="690" role="img" aria-labelledby="t d">
<title id="t">The website card lists five apps in two places, and no hostnames. Place web is one serving device: site is your pages, served by React on port 8080, open to anyone. strapi is Strapi editor on port 1337, org login. umami is Umami dashboard on port 3000, org login. analytics is Umami tracking script, same process as umami on port 3000, open to anyone. Place monitor may be another serving device: status is Uptime Kuma on port 3001, org login. The card names no device and no organization.</title>
<desc id="d">The website card lists five apps in two places, and no hostnames. Place web is one serving device: site is your pages, served by React on port 8080, open to anyone. strapi is Strapi editor on port 1337, org login. umami is Umami dashboard on port 3000, org login. analytics is Umami tracking script, same process as umami on port 3000, open to anyone. Place monitor may be another serving device: status is Uptime Kuma on port 3001, org login. The card names no device and no organization.</desc>
