apiVersion: v1
kind: Card
metadata:
  name: website
  description: Public React site, its editor, open tracker, locked dashboard, locked monitor
  type: pattern
  added: 2026-10-05

applications:
  - name: site
    what: your pages, served by React
    from: website-site:latest
    port: 8080
    protocol: https
    subtype: existing
    published: true
    authModes: [none]
    place: web

  - name: strapi
    what: Strapi editor
    from: website-strapi:latest
    database: postgres:16-alpine
    port: 1337
    protocol: https
    subtype: existing
    published: true
    authModes: [org]
    place: web

  - name: umami
    what: Umami dashboard
    from: ghcr.io/umami-software/umami:latest
    database: postgres:15-alpine
    port: 3000
    protocol: https
    subtype: existing
    published: true
    authModes: [org]
    place: web

  - name: analytics
    what: Umami tracking script, same process as umami
    from: ghcr.io/umami-software/umami:latest
    port: 3000
    protocol: https
    subtype: existing
    published: true
    authModes: [none]
    place: web

  - name: status
    what: Uptime Kuma
    from: louislam/uptime-kuma:2
    port: 3001
    protocol: https
    subtype: existing
    published: true
    authModes: [org]
    place: monitor
